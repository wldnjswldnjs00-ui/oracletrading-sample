          "name": "What is the Kelly Criterion?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The Kelly Criterion is a mathematical formula used to determine the optimal size of a series of bets or investments to maximize long-term growth. Formula: f = (p * b - q) / b, where p is win probability, q is loss probability, and b is the win/loss ratio."
          }
        },
        {
          "@type": "Question",
          "name": "What is compound interest?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Compound interest is interest calculated on both the initial principal and the accumulated interest from previous periods. Formula: A = P(1 + r)^n, where P is principal, r is rate per period, and n is number of periods."
          }
        },
        {
          "@type": "Question",
          "name": "What is the Martingale strategy?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The Martingale strategy is a position-sizing method where you increase your investment at each lower price level to reduce your average entry price. When the price recovers to break-even, you profit from all accumulated positions."
          }
        }
      ]
    }
    </script>
