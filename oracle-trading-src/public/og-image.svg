<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Pure black background -->
  <rect width="1200" height="630" fill="#000000"/>

  <!-- Ascending bars — white, solid, no gradient -->
  <rect x="495" y="247" width="42" height="48"  rx="4" fill="white" opacity="0.35"/>
  <rect x="551" y="207" width="42" height="88"  rx="4" fill="white" opacity="0.55"/>
  <rect x="607" y="157" width="42" height="138" rx="4" fill="white" opacity="0.78"/>
  <rect x="663" y="97"  width="42" height="198" rx="4" fill="white"/>

  <!-- Trend line -->
  <polyline
    points="516,247 572,207 628,157 684,97"
    fill="none" stroke="white" stroke-width="3"
    stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>

  <!-- Oracle Trading -->
  <text x="600" y="368"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="88" font-weight="700"
    fill="white" letter-spacing="-2">Oracle Trading</text>

  <!-- Tagline -->
  <text x="600" y="420"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="20" font-weight="400"
    fill="white" opacity="0.45"
    letter-spacing="5">INVESTMENT STRATEGY CALCULATOR</text>
</svg>
