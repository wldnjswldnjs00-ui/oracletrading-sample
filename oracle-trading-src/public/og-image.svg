<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0800"/>
      <stop offset="100%" stop-color="#1a1000"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#F5D06A"/>
    </linearGradient>
    <linearGradient id="goldV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5D06A"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <linearGradient id="barGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Full bleed background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle radial vignette -->
  <radialGradient id="vignette" cx="30%" cy="50%" r="80%">
    <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.04"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.5"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#vignette)"/>

  <!-- Gold top border line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#gold)"/>

  <!-- ─── LEFT: Text content ─── -->

  <!-- OT badge -->
  <rect x="80" y="90" width="52" height="52" rx="10"
        fill="#D4AF37" fill-opacity="0.15"
        stroke="#D4AF37" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="106" y="124" font-family="Georgia, serif" font-size="19" font-weight="800"
        fill="#D4AF37" text-anchor="middle">OT</text>

  <!-- Oracle -->
  <text x="80" y="230" font-family="Georgia, serif" font-size="80" font-weight="800"
        fill="white" letter-spacing="-2">Oracle</text>
  <!-- Trading in gold -->
  <text x="80" y="318" font-family="Georgia, serif" font-size="80" font-weight="800"
        fill="url(#goldV)" letter-spacing="-2">Trading</text>

  <!-- Gold accent line -->
  <rect x="80" y="338" width="72" height="4" rx="2" fill="url(#gold)"/>

  <!-- Tagline -->
  <text x="80" y="384" font-family="Arial, sans-serif" font-size="20"
        fill="white" fill-opacity="0.5" letter-spacing="0.5">Investment Strategy Calculator</text>

  <!-- 4 tool pills -->
  <rect x="80" y="418" width="148" height="36" rx="18"
        fill="#D4AF37" fill-opacity="0.1" stroke="#D4AF37" stroke-opacity="0.3" stroke-width="1"/>
  <text x="154" y="441" font-family="Arial, sans-serif" font-size="13" font-weight="600"
        fill="#D4AF37" text-anchor="middle">Compound Interest</text>

  <rect x="240" y="418" width="130" height="36" rx="18"
        fill="#D4AF37" fill-opacity="0.1" stroke="#D4AF37" stroke-opacity="0.3" stroke-width="1"/>
  <text x="305" y="441" font-family="Arial, sans-serif" font-size="13" font-weight="600"
        fill="#D4AF37" text-anchor="middle">Kelly Criterion</text>

  <rect x="80" y="464" width="128" height="36" rx="18"
        fill="#D4AF37" fill-opacity="0.1" stroke="#D4AF37" stroke-opacity="0.3" stroke-width="1"/>
  <text x="144" y="487" font-family="Arial, sans-serif" font-size="13" font-weight="600"
        fill="#D4AF37" text-anchor="middle">Martingale Sim</text>

  <rect x="220" y="464" width="118" height="36" rx="18"
        fill="#D4AF37" fill-opacity="0.1" stroke="#D4AF37" stroke-opacity="0.3" stroke-width="1"/>
  <text x="279" y="487" font-family="Arial, sans-serif" font-size="13" font-weight="600"
        fill="#D4AF37" text-anchor="middle">VIP Strategy</text>

  <!-- URL -->
  <text x="80" y="560" font-family="Arial, sans-serif" font-size="15"
        fill="#D4AF37" fill-opacity="0.5">oracletrading.site</text>

  <!-- FREE badge -->
  <rect x="80" y="578" width="76" height="26" rx="13"
        fill="#D4AF37" fill-opacity="0.12" stroke="#D4AF37" stroke-opacity="0.3" stroke-width="1"/>
  <text x="118" y="596" font-family="Arial, sans-serif" font-size="11" font-weight="700"
        fill="#D4AF37" text-anchor="middle">✨ FREE</text>

  <!-- ─── RIGHT: Bar chart visual ─── -->

  <!-- Vertical divider -->
  <line x1="620" y1="60" x2="620" y2="570"
        stroke="#D4AF37" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Chart area background glow -->
  <rect x="640" y="60" width="560" height="510" fill="url(#barGlow)"/>

  <!-- 5 ascending bars -->
  <!-- Bar 1 -->
  <rect x="680" y="430" width="64" height="110" rx="6"
        fill="#D4AF37" fill-opacity="0.45"/>
  <!-- Bar 2 -->
  <rect x="764" y="360" width="64" height="180" rx="6"
        fill="#D4AF37" fill-opacity="0.58"/>
  <!-- Bar 3 -->
  <rect x="848" y="270" width="64" height="270" rx="6"
        fill="#D4AF37" fill-opacity="0.72"/>
  <!-- Bar 4 -->
  <rect x="932" y="180" width="64" height="360" rx="6"
        fill="#D4AF37" fill-opacity="0.86"/>
  <!-- Bar 5 (tallest, brightest) -->
  <rect x="1016" y="90" width="64" height="450" rx="6"
        fill="url(#goldV)" filter="url(#softglow)"/>

  <!-- Trend line over bars -->
  <polyline points="712,425 796,355 880,265 964,175 1048,85"
            fill="none" stroke="#F5D06A" stroke-width="4"
            stroke-linecap="round" stroke-linejoin="round"
            filter="url(#glow)"/>

  <!-- Dots on trend line -->
  <circle cx="712" cy="425" r="5" fill="#D4AF37"/>
  <circle cx="796" cy="355" r="5" fill="#D4AF37"/>
  <circle cx="880" cy="265" r="5" fill="#D4AF37"/>
  <circle cx="964" cy="175" r="5" fill="#D4AF37"/>
  <circle cx="1048" cy="85" r="8" fill="#F5D06A" filter="url(#glow)"/>

  <!-- Gold bottom border line -->
  <rect x="0" y="627" width="1200" height="3" fill="url(#gold)"/>
</svg>
