<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="og" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="24" cy="24" r="22" fill="#1a1200" stroke="#D4AF37" stroke-width="1.5" opacity="0.9"/>
  <!-- Orange flame/chart icon: upward trending arrow with flame base -->
  <!-- Candlestick-style chart bars -->
  <rect x="9" y="30" width="5" height="10" rx="1" fill="url(#og)" opacity="0.85"/>
  <rect x="17" y="22" width="5" height="18" rx="1" fill="url(#og)"/>
  <rect x="25" y="15" width="5" height="25" rx="1" fill="url(#og)"/>
  <!-- Trend line arrow -->
  <polyline points="10,32 18,24 26,17 36,10" fill="none" stroke="#FF8C00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Arrowhead -->
  <polygon points="36,10 30,11 33,16" fill="#FF8C00" filter="url(#glow)"/>
</svg>
