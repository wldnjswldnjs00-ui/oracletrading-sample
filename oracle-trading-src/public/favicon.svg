<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1000"/>
      <stop offset="100%" stop-color="#0d0800"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5D06A"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
  </defs>

  <!-- Square background with rounded corners -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>
  <!-- Gold border -->
  <rect width="512" height="512" rx="96" ry="96" fill="none" stroke="url(#border)" stroke-width="18"/>

  <!-- Candlestick bars (rising left to right) -->
  <rect x="90"  y="310" width="52" height="142" rx="10" fill="url(#gold)" opacity="0.75"/>
  <rect x="190" y="230" width="52" height="222" rx="10" fill="url(#gold)" opacity="0.88"/>
  <rect x="290" y="148" width="52" height="304" rx="10" fill="url(#gold)"/>

  <!-- Trend line -->
  <polyline
    points="110,320 210,238 310,156 400,88"
    fill="none"
    stroke="#F5D06A"
    stroke-width="26"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Arrowhead -->
  <polygon points="400,88 355,108 372,152" fill="#F5D06A"/>
</svg>
